<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Feedback Submitted</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <style>

        .feedback-container {
            max-width: 650px;
            margin: 70px auto;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            text-align: center;
        }

        .feedback-container h1 {
            color: #29213e;
            margin-bottom: 12px;
        }

        .feedback-container p {
            color: #6f687c;
            line-height: 1.6;
        }

        .home-button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            border-radius: 12px;
            background: #713be1;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .home-button:hover {
            background: #5f2fc7;
        }

    </style>

</head>

<body>

    <div class="feedback-container">

        <h1>💜 Thank You!</h1>

        <p>
            Your feedback and suggestions have been submitted successfully.
        </p>

        <p>
            Your suggestions will help us improve ComicCraft.
        </p>

        <a
            href="/"
            class="home-button"
        >
            ✨ Create Another Comic
        </a>

    </div>

</body>

</html>
